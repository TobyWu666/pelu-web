name: Update admin stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update stats files
        run: node scripts/update-admin-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPO: TobyWu666/pelu-releases
          RELEASE_ASSET_NAME: PeluMac.dmg
          WEB_ANALYTICS_PROVIDER: ${{ vars.WEB_ANALYTICS_PROVIDER }}
          WEB_VIEWS_TOTAL: ${{ vars.WEB_VIEWS_TOTAL }}
          WEB_UNIQUE_VISITORS: ${{ vars.WEB_UNIQUE_VISITORS }}
          WEB_VIEWS_RANGE_DAYS: ${{ vars.WEB_VIEWS_RANGE_DAYS }}

      - name: Commit updated stats
        run: |
          if git diff --quiet -- data/admin-stats.json data/admin-stats.js; then
            echo "No stats changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/admin-stats.json data/admin-stats.js
          git commit -m "Update admin stats"
          git push
